<template>
    <!-- Full-viewport backdrop: closes popover on outside click -->
    <div class="c-ep-backdrop" onclick={handleBackdropClick}></div>

    <!-- Floating panel -->
    <div class="c-ep-panel" style={panelStyle}>

        <!-- Directional arrow -->
        <div class={arrowClass}></div>

        <!-- ── Header ───────────────────────────── -->
        <div class="c-ep-header">
            <div class={typeInfo.avatarClass}>
                <lightning-icon
                    icon-name={typeInfo.icon}
                    size="small"
                    alternative-text={typeInfo.label}>
                </lightning-icon>
            </div>
            <div class="c-ep-header-body">
                <p class="c-ep-type-label">{typeInfo.label}</p>
                <h2 class="c-ep-title">
                    {title}
                    <template lwc:if={detail.isCritical}>
                        <span class="c-ep-critical-dot" title="Critical">●</span>
                    </template>
                </h2>
                <p class="c-ep-description">{detail.description}</p>
                <template lwc:if={detail.isShared}>
                    <div class="c-ep-shared-badge">
                        <lightning-icon icon-name="utility:groups" size="xx-small" alternative-text="Shared event"></lightning-icon>
                        <span>Shared event — {detail.sharedWith}</span>
                    </div>
                </template>
            </div>
            <button class="c-ep-close" onclick={handleClose} title="Close">
                <lightning-icon icon-name="utility:close" size="xx-small" alternative-text="Close"></lightning-icon>
            </button>
        </div>

        <!-- ── Scrollable body ───────────────────── -->
        <div class="c-ep-body">

        <!-- ── Key metrics bar ───────────────────── -->
        <!-- Life event highlights: Event Name · Event Date · Event Type -->
        <template lwc:if={isLifeEvent}>
            <div class="c-ep-metrics">
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">EVENT NAME</span>
                    <span class="c-ep-metric-value">{title}</span>
                </div>
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">EVENT DATE</span>
                    <span class="c-ep-metric-value">{detail.date}</span>
                </div>
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">EVENT TYPE</span>
                    <span class="c-ep-metric-value">{typeInfo.label}</span>
                </div>
            </div>
        </template>
        <!-- Goal highlights: Name · Target Date · Target Amount -->
        <template lwc:elseif={isGoalEvent}>
            <div class="c-ep-metrics">
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">NAME</span>
                    <span class="c-ep-metric-value">{title}</span>
                </div>
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">TARGET DATE</span>
                    <span class="c-ep-metric-value">{detail.targetDate}</span>
                </div>
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">TARGET AMOUNT</span>
                    <span class="c-ep-metric-value">{detail.targetAmount}</span>
                </div>
            </div>
        </template>
        <!-- Financial account highlights: Name · Opening Date · Total Outstanding Amount -->
        <template lwc:elseif={isFinancialEvent}>
            <div class="c-ep-metrics">
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">NAME</span>
                    <span class="c-ep-metric-value">{title}</span>
                </div>
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">OPENING DATE</span>
                    <span class="c-ep-metric-value">{detail.openingDate}</span>
                </div>
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">TOTAL OUTSTANDING</span>
                    <span class="c-ep-metric-value">{detail.totalOutstandingAmount}</span>
                </div>
            </div>
        </template>
        <!-- Engagement highlights: Subject · Start · Location -->
        <template lwc:elseif={isEngagementEvent}>
            <div class="c-ep-metrics">
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">SUBJECT</span>
                    <span class="c-ep-metric-value">{detail.subject}</span>
                </div>
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">START</span>
                    <span class="c-ep-metric-value">{detail.startDateTime}</span>
                </div>
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">LOCATION</span>
                    <span class="c-ep-metric-value">{detail.location}</span>
                </div>
            </div>
        </template>
        <!-- Default highlights: Date · Members Affected · Status -->
        <template lwc:else>
            <div class="c-ep-metrics">
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">DATE</span>
                    <span class="c-ep-metric-value">{detail.date}</span>
                </div>
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">MEMBERS AFFECTED</span>
                    <span class="c-ep-metric-value">{detail.membersAffected}</span>
                </div>
                <div class="c-ep-metric">
                    <span class="c-ep-metric-label">STATUS</span>
                    <span class={statusClass}>{detail.status}</span>
                </div>
            </div>
        </template>

        <!-- ── Agentic Insight card ──────────────── -->
        <template lwc:if={showAiCard}>
            <div class="c-ep-ai-card">
                <!-- Card header -->
                <div class="c-ep-ai-header">
                    <div class="c-ep-ai-header-title">
                        <span class="c-ep-ai-sparkle" aria-hidden="true">✦✧</span>
                        <span class="c-ep-ai-title">Agentic Insights</span>
                        <span class="c-ep-ai-info-badge" title="AI-generated insights based on household data">
                            <lightning-icon icon-name="utility:info" size="xx-small" alternative-text="About insights"></lightning-icon>
                        </span>
                    </div>
                    <button class="c-ep-ai-dismiss" onclick={handleDismissAi} title="Dismiss">
                        <lightning-icon icon-name="utility:close" size="xx-small" alternative-text="Dismiss"></lightning-icon>
                    </button>
                </div>

                <!-- Sentiment Insights: per-member grid -->
                <template lwc:if={hasSentimentInsights}>
                    <div class="c-ep-sentiment-grid">
                        <template for:each={detail.sentimentInsights} for:item="si">
                            <div key={si.name} class="c-ep-sentiment-row">
                                <div class="c-ep-sentiment-person">
                                    <p class="c-ep-sentiment-name">{si.name}</p>
                                    <p class="c-ep-sentiment-role">{si.role}</p>
                                </div>
                                <p class="c-ep-sentiment-insight">
                                    <strong>{si.keyword}.</strong> {si.insight}
                                </p>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Plain AI insight text (fallback) -->
                <template lwc:else>
                    <p class="c-ep-ai-text">{detail.aiInsight}</p>
                </template>

                <!-- CTA button -->
                <template lwc:if={detail.aiActionLabel}>
                    <lightning-button
                        label={detail.aiActionLabel}
                        variant="brand"
                        class="c-ep-ai-cta"
                        onclick={handleCtaClick}>
                    </lightning-button>
                </template>
            </div>
        </template>

        <!-- ── Detail grid ───────────────────────── -->
        <!-- Engagement detail: End · Name (Who) · Related To · Show Time As · Description -->
        <template lwc:if={isEngagementEvent}>
            <div class="c-ep-detail-grid">
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">END</span>
                    <span class="c-ep-detail-value">{detail.endDateTime}</span>
                </div>
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">NAME (WHO)</span>
                    <span class="c-ep-detail-value">{detail.whoName}</span>
                </div>
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">RELATED TO</span>
                    <span class="c-ep-detail-value">{detail.relatedTo}</span>
                </div>
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">SHOW TIME AS</span>
                    <span class="c-ep-detail-value">{detail.showTimeAs}</span>
                </div>
            </div>
            <div class="c-ep-action-taken">
                <span class="c-ep-detail-label">DESCRIPTION</span>
                <p class="c-ep-detail-value">{detail.engagementNotes}</p>
            </div>
        </template>
        <!-- Financial account detail: Type · Status · Account Number · Maturity Date · Held Away -->
        <template lwc:elseif={isFinancialEvent}>
            <div class="c-ep-detail-grid">
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">TYPE</span>
                    <span class="c-ep-detail-value">{detail.accountType}</span>
                </div>
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">STATUS</span>
                    <span class={statusClass}>{detail.status}</span>
                </div>
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">FINANCIAL ACCOUNT NUMBER</span>
                    <span class="c-ep-detail-value">{detail.accountNumber}</span>
                </div>
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">MATURITY DATE</span>
                    <span class="c-ep-detail-value">{detail.maturityDate}</span>
                </div>
            </div>
            <div class="c-ep-action-taken">
                <span class="c-ep-detail-label">HELD AWAY</span>
                <p class="c-ep-detail-value">{detail.heldAway}</p>
            </div>
        </template>
        <!-- Goal bespoke card -->
        <template lwc:elseif={isGoalEvent}>
            <div class="c-ep-goal-card">

                <!-- (a) Goal summary: amounts + pace + progress bar -->
                <div class="c-ep-goal-section">
                    <div class="c-ep-goal-progress-header">
                        <div class="c-ep-goal-amounts">
                            <span class="c-ep-goal-actual">{detail.actualAmount}</span>
                            <span class="c-ep-goal-of">of</span>
                            <span class="c-ep-goal-target">{detail.targetAmount}</span>
                            <span class="c-ep-goal-pct">{goalProgressPct}%</span>
                        </div>
                        <span class={goalPaceClass}>{detail.pace}</span>
                    </div>
                    <div class="c-ep-goal-bar-track">
                        <div class="c-ep-goal-bar-fill" style={goalProgressBarStyle}></div>
                    </div>
                    <div class="c-ep-goal-meta">
                        <span class="c-ep-goal-meta-chip">
                            <span class="c-ep-goal-meta-lbl">Priority</span>
                            <span class="c-ep-goal-meta-val">{detail.priority}</span>
                        </span>
                        <span class="c-ep-goal-meta-sep">·</span>
                        <span class="c-ep-goal-meta-chip">
                            <span class="c-ep-goal-meta-lbl">Type</span>
                            <span class="c-ep-goal-meta-val">{detail.goalType}</span>
                        </span>
                    </div>
                </div>

                <!-- (b) Goal span: Start → Today → Target -->
                <div class="c-ep-goal-section c-ep-goal-section_span">
                    <p class="c-ep-goal-section-label">Goal Timeline</p>
                    <div class="c-ep-goal-span-wrap">
                        <span class="c-ep-goal-span-date">{detail.startDate}</span>
                        <div class="c-ep-goal-span-rail">
                            <div class="c-ep-goal-span-line"></div>
                            <div class="c-ep-goal-today-marker" style={todayMarkerStyle}>
                                <div class="c-ep-goal-today-pill">Today</div>
                                <div class="c-ep-goal-today-dot"></div>
                            </div>
                        </div>
                        <span class="c-ep-goal-span-date c-ep-goal-span-date_end">{detail.targetDate}</span>
                    </div>
                </div>

                <!-- (c) Linked funding account (1:1) -->
                <template lwc:if={hasLinkedAccount}>
                    <div class="c-ep-goal-section c-ep-goal-section_account">
                        <p class="c-ep-goal-section-label">Funding Account</p>
                        <div class="c-ep-goal-account-card">
                            <div class="c-ep-goal-account-top">
                                <div>
                                    <p class="c-ep-goal-account-name">{detail.linkedAccount.name}</p>
                                    <p class="c-ep-goal-account-num">{detail.linkedAccount.number}</p>
                                </div>
                            </div>
                            <div class="c-ep-goal-account-rows">
                                <div class="c-ep-goal-account-row">
                                    <span class="c-ep-goal-account-key">Contributing to goal</span>
                                    <span class="c-ep-goal-account-val">{detail.linkedAccount.contributionAmount}</span>
                                </div>
                                <div class="c-ep-goal-account-row">
                                    <span class="c-ep-goal-account-key">Unallocated balance</span>
                                    <span class="c-ep-goal-account-val">{detail.linkedAccount.availableBalance}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- (d) Competing goals (same funding account) -->
                <template lwc:if={hasCompetingGoals}>
                    <div class="c-ep-goal-section c-ep-goal-section_competing">
                        <p class="c-ep-goal-section-label">Also funded by {detail.linkedAccount.name}</p>
                        <template for:each={detail.competingGoals} for:item="cg">
                            <div key={cg.name} class="c-ep-goal-competing-row">
                                <span class="c-ep-goal-competing-name">{cg.name}</span>
                                <div class="c-ep-goal-competing-right">
                                    <span class="c-ep-goal-competing-amt">{cg.amount}</span>
                                    <span class={cg.statusClass}>{cg.status}</span>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- View Record -->
                <div class="c-ep-goal-view-record">
                    <a class="c-ep-goal-view-link" href="#">View Record →</a>
                </div>

            </div>
        </template>
        <!-- Life event detail: Person fields from PersonLifeEvent object -->
        <template lwc:elseif={isLifeEvent}>
            <div class="c-ep-detail-grid">
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">PRIMARY PERSON</span>
                    <span class="c-ep-detail-value">{detail.primaryPerson}</span>
                </div>
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">RELATED PERSON</span>
                    <span class="c-ep-detail-value">{detail.relatedPerson}</span>
                </div>
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">EVENT LOCATION (CITY)</span>
                    <span class="c-ep-detail-value">{detail.eventLocation}</span>
                </div>
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">OWNER</span>
                    <span class="c-ep-detail-value">{detail.owner}</span>
                </div>
            </div>
            <div class="c-ep-action-taken">
                <span class="c-ep-detail-label">EVENT DESCRIPTION</span>
                <p class="c-ep-detail-value">{detail.eventDescription}</p>
            </div>
        </template>
        <!-- Default detail grid: financial / engagement / goal fields -->
        <template lwc:else>
            <div class="c-ep-detail-grid">
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">DATE</span>
                    <span class="c-ep-detail-value">{detail.date}</span>
                </div>
                <div class="c-ep-detail-cell">
                    <span class="c-ep-detail-label">MEMBERS</span>
                    <span class="c-ep-detail-value">{detail.members}</span>
                </div>
                <template lwc:if={showCashFlow}>
                    <div class="c-ep-detail-cell">
                        <span class="c-ep-detail-label">CASH-FLOW IMPACT</span>
                        <span class="c-ep-detail-value">{detail.cashFlowImpact}</span>
                    </div>
                    <div class="c-ep-detail-cell">
                        <span class="c-ep-detail-label">BENEFICIARIES</span>
                        <span class="c-ep-detail-value">{detail.beneficiaries}</span>
                    </div>
                </template>
            </div>
            <div class="c-ep-action-taken">
                <span class="c-ep-detail-label">ACTION TAKEN</span>
                <p class="c-ep-detail-value">{detail.actionTaken}</p>
            </div>
        </template>

        </div><!-- end c-ep-body -->

        <!-- ── Footer ───────────────────────────── -->
        <div class="c-ep-footer">
            <lightning-button-menu
                label="Actions"
                icon-name="utility:down"
                menu-alignment="right"
                variant="neutral">
                <lightning-menu-item value="edit"        label="Edit Event"></lightning-menu-item>
                <lightning-menu-item value="add-note"    label="Add Note"></lightning-menu-item>
                <lightning-menu-item value="create-task" label="Create Task"></lightning-menu-item>
            </lightning-button-menu>
        </div>

    </div>
</template>
